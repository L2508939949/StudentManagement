<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>受講生一覧</title>
</head>
<body>
<h1>受講生一覧</h1>
<table border="1">
  <thead>
  <tr>
    <th>ID</th>
    <th>名前</th>
    <th>カナ名</th>
    <th>ニックネーム</th>
    <th>メールアドレス</th>
    <th>地域</th>
    <th>年齢</th>
    <th>性別</th>
    <th>備考</th>
    <th>キャンセル</th>
  </tr>
  </thead>
  <tbody>
  <tr th:each="studentDetail : ${studentList}">
    <td>
      <a th:href="@{/updateStudentForm(studentID=${studentDetail.student.studentID})}">
        <span th:text="${studentDetail.student.studentID}">st00000001</span>
      </a>
    </td>
    <td th:text="${studentDetail.student.name}">山田太郎</td>
    <td th:text="${studentDetail.student.kanaName}">ヤマダタロウ</td>
    <td th:text="${studentDetail.student.nickName}">ヤマダタロウ</td>
    <td th:text="${studentDetail.student.email}">yamada@outlook.jp</td>
    <td th:text="${studentDetail.student.area}">大阪府大阪市北区</td>
    <td th:text="${studentDetail.student.age}">32</td>
    <td th:text="${studentDetail.student.gender}">男性</td>
    <td th:text="${studentDetail.student.remark}">特になし</td>
    <td>
      <input type="checkbox" th:checked = "${studentDetail.student.isDeleted}" />
    </td>
  </tr>
  </tbody>
</table>
</body>
</html>
