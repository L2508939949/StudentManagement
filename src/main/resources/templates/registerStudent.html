<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>受講生登録</title>
  <style>
   form {
      width: 400px;
    }
   textarea#remark {
      width: 300px;
      height: 80px;
      margin-left: 55px;
    }
  </style>
</head>
<body>
<h1>受講生登録</h1>
<form th:action="@{/registerStudent}" th:object="${studentDetail}" method="post">
  <fieldset>
    <div>
      <label for="studentID">ID:</label>
      <input type="text" id="studentID" th:field="*{student.studentID}" required />
    </div>
    <div>
      <label for="name">名前:</label>
      <input type="text" id="name" th:field="*{student.name}" required />
    </div>
    <div>
      <label for="kanaName">カナ名:</label>
      <input type="text" id="kanaName" th:field="*{student.kanaName}" required />
    </div>

    <div>
      <label for="nickName">ニックネーム:</label>
      <input type="text" id="nickName" th:field="*{student.nickName}" required />
    </div>

    <div>
      <label for="email">メールアドレス:</label>
      <input type="text" id="email" th:field="*{student.email}" required />
    </div>

    <div>
      <label for="area">地域:</label>
      <input type="text" id="area" th:field="*{student.area}" required />
    </div>

    <div>
      <label for="age">年齢:</label>
      <input type="text" id="age" th:field="*{student.age}" required />
    </div>

    <div>
      <label for="gender">性別(男:女):</label>
      <select id="gender" th:field="*{student.gender}">
        <option value="">選択してください</option>
        <option value="男">男</option>
        <option value="女">女</option>
      </select>
    </div>
    <div>
      <label for="remark">備考欄:</label>
      <textarea id="remark" th:field="*{student.remark}" rows="5" cols="40"
      ></textarea>
    </div>
  </fieldset>

  <fieldset>
    <legend>コース情報（1件のみ）</legend>
    <div>
      <label for="courseID">コースID:</label>
      <input type="text" th:field="*{course.courseID}" id="courseID"/><br/>
    </div>

    <div>
      <label for="courseName">コース名:</label>
      <input type="text" th:field="*{course.courseName}" id="courseName"/><br/>
    </div>

    <div>
      <label for="courseStartday">開始日:</label>
      <input type="datetime-local" th:field="*{course.courseStartday}" id="courseStartday"/><br/>
    </div>

    <div>
      <label for="courseEndday">終了日:</label>
      <input type="datetime-local" th:field="*{course.courseEndday}" id="courseEndday"/><br/>
    </div>

  </fieldset>
  </div>
    <button type="submit">登録</button>
  </div>
</form>
</body>
</html>
